name: Static Analysis

on:
  pull_request:
    branches: [main]
    # paths:
    #   - ".github/workflows/analyze-app.yml"
    #   - "app/**" # would probably be force-app/* in a more realistic SF app repo

jobs:
  steps:
    - name: Azure login (OIDC — no stored credentials)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Fetch Salesforce credentials from Key Vault
      shell: bash
      run: |
        set -euo pipefail

        az keyvault secret list --vault-name kv-salesforce-cicd-demo
