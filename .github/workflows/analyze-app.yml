name: Static Analysis

on:
  pull_request:
    branches: [main]
    # paths:
    #   - ".github/workflows/analyze-app.yml"
    #   - "app/**" # would probably be force-app/* in a more realistic SF app repo

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true # new push to the PR supersedes the old run

jobs:
  static-analysis:
    name: Runs PMD Static Analysis
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # allows creation of PR review
      contents: read
      security-events: write # required to upload SARIF to GitHub Security
      actions: read # required for private repos

    steps:
      - name: Checkout (full history for delta computation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI + plugin
        run: |
          npm install -g @salesforce/cli@latest
          sf plugins install code-analyzer@latest

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace ./app/force-app --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}

      - name: Upload Code Analyzer results to GitHub Security
        if: steps.delta.outputs.has_changes == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: code-analysis-results.sarif
          category: salesforce-code-analyzer

      # Option 1: Quality gate on ALL files in the repository
      - name: Fail on Critical/High Violations (All Files)
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-sev2-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 10
        run: exit 1

      # Option 2: Quality gate on CHANGED files only (useful for legacy codebases)
      - name: Fail on Critical/High Violations (Changed Files Only)
        if: |
          steps.run-code-analyzer.outputs.num-sev1-violations-in-changed-files > 0 ||
          steps.run-code-analyzer.outputs.num-sev2-violations-in-changed-files > 0
        run: exit 1
